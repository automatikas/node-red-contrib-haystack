<script type="text/html" data-template-name="haystack-server">
  <div class="form-row">
    <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-config-input-name" />
  </div>
  <div class="form-row">
    <label for="node-config-input-baseUrl"><i class="fa fa-globe"></i> Base URL</label>
    <input type="text" id="node-config-input-baseUrl" placeholder="http://127.0.0.1:8080" />
  </div>
  <div class="form-row">
    <label for="node-config-input-projectPath"><i class="fa fa-sitemap"></i> Project Path</label>
    <input type="text" id="node-config-input-projectPath" placeholder="/api/{projectName}" />
  </div>
  <div class="form-row">
    <label for="node-config-input-username"><i class="fa fa-user"></i> Username</label>
    <input type="text" id="node-config-input-username" />
  </div>
  <div class="form-row">
    <label for="node-config-input-password"><i class="fa fa-lock"></i> Password</label>
    <input type="password" id="node-config-input-password" />
  </div>
  <div class="form-row">
    <label for="node-config-input-requestTimeout"><i class="fa fa-clock-o"></i> Timeout (ms)</label>
    <input type="text" id="node-config-input-requestTimeout" placeholder="30000" />
  </div>
</script>

<script type="text/html" data-help-name="haystack-server">
  <p>Connection settings for Project Haystack servers such as Haxall, FIN, SkySpark, and other Haystack-compatible platforms.</p>
  <p><code>Base URL</code> is the server root, for example <code>http://127.0.0.1:8080</code>.</p>
  <p><code>Project Path</code> is the Haystack HTTP API path under that server, following the Project Haystack pattern <code>/api/{projectName}</code>.</p>
  <p>In Haxall, the default project is typically <code>sys</code>, so the common path is <code>/api/sys</code>. Other servers may expose a different project or API path.</p>
  <p>This package targets the Project Haystack HTTP API rather than a single vendor framework.</p>
</script>

<script type="text/javascript">
  RED.nodes.registerType("haystack-server", {
    category: "config",
    defaults: {
      name: { value: "" },
      baseUrl: { value: "", required: true },
      projectPath: { value: "/api/sys", required: true },
      requestTimeout: { value: "30000", required: true, validate: RED.validators.number() }
    },
    credentials: {
      username: { type: "text", required: true },
      password: { type: "password", required: true }
    },
    label: function () {
      return this.name || `${this.baseUrl || "haystack"}${this.projectPath || ""}`;
    }
  });
</script>
