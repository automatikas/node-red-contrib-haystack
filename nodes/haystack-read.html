<script type="text/html" data-template-name="haystack-read">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" />
  </div>
  <div class="form-row">
    <label for="node-input-server"><i class="fa fa-plug"></i> Server</label>
    <input type="text" id="node-input-server" />
  </div>
  <div class="form-row">
    <label for="node-input-filter"><i class="fa fa-filter"></i> Filter</label>
    <input type="text" id="node-input-filter" placeholder="point and siteMeter" />
  </div>
  <div class="form-row">
    <label for="node-input-recordId"><i class="fa fa-crosshairs"></i> Id</label>
    <input type="text" id="node-input-recordId" placeholder="@someId" />
  </div>
  <div class="form-row">
    <label for="node-input-format"><i class="fa fa-exchange"></i> Format</label>
    <select id="node-input-format">
      <option value="zinc">Zinc</option>
      <option value="json">JSON</option>
      <option value="trio">Trio</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-input-outputMode"><i class="fa fa-reply"></i> Return</label>
    <select id="node-input-outputMode">
      <option value="string">a UTF-8 string</option>
      <option value="object">a parsed JSON object</option>
    </select>
  </div>
</script>

<script type="text/html" data-help-name="haystack-read">
  <p>Convenience node for the Project Haystack <code>read</code> op.</p>
  <p>Use either a filter read or a read by id:</p>
  <p>- Filter read: sends a request for records matching a Haystack filter string.</p>
  <p>- Read by id: sends a request grid with an <code>id</code> Ref column.</p>
  <p>If both Filter and Id are configured, Filter wins.</p>
  <p>Message examples:</p>
  <p>- <code>msg.haystack.filter = "point and temp and equipRef==@someEquipRef"</code></p>
  <p>- <code>msg.haystack.id = "@someRecordRef"</code></p>
  <p>Generated request bodies use Zinc. Format controls the response format unless you explicitly provide <code>msg.rawBody</code>.</p>
</script>

<script type="text/javascript">
  RED.nodes.registerType("haystack-read", {
    category: "haystack",
    color: "#4476a4",
    defaults: {
      name: { value: "" },
      server: { value: "", type: "haystack-server", required: true },
      filter: { value: "" },
      recordId: { value: "" },
      format: { value: "zinc" },
      outputMode: { value: "string" }
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-tags",
    label: function () {
      return this.name || "haystack-read";
    }
  });
</script>
